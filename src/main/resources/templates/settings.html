<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">
<body>
    <div th:fragment="content" class="content-area">
        <div class="page-header">
            <h2>Settings</h2>
            <p>Configure your AEM Builder preferences</p>
        </div>
        
        <div class="settings-content">
            <div class="settings-section">
                <h3>General Settings</h3>
                <form class="settings-form">
                    <div class="form-group">
                        <label for="defaultAemVersion">Default AEM Version</label>
                        <select id="defaultAemVersion" class="form-control">
                            <option value="6.5">AEM 6.5</option>
                            <option value="cloud">AEM as a Cloud Service</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="defaultGroupId">Default Group ID</label>
                        <input type="text" id="defaultGroupId" class="form-control" value="com.example">
                    </div>
                    <button type="submit" class="btn btn-primary">Save Settings</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
