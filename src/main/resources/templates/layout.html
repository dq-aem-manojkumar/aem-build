<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - AEM Builder'">AEM Builder</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-cube"></i>
                    <span>AEM Builder</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <ul>
                    <li>
                        <a th:href="@{/}" th:classappend="${#strings.equals(pageTitle, 'AEM Builder Dashboard')} ? 'active' : ''">
                            <i class="fas fa-home"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/projects}" th:classappend="${#strings.equals(pageTitle, 'Projects')} ? 'active' : ''">
                            <i class="fas fa-folder"></i>
                            <span>Projects</span>
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/templates}" th:classappend="${#strings.equals(pageTitle, 'Templates')} ? 'active' : ''">
                            <i class="fas fa-file-code"></i>
                            <span>Templates</span>
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/components}" th:classappend="${#strings.equals(pageTitle, 'Components')} ? 'active' : ''">
                            <i class="fas fa-puzzle-piece"></i>
                            <span>Components</span>
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/settings}" th:classappend="${#strings.equals(pageTitle, 'Settings')} ? 'active' : ''">
                            <i class="fas fa-cog"></i>
                            <span>Settings</span>
                        </a>
                    </li>
                </ul>
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="user-details">
                        <span class="user-name">Developer</span>
                        <span class="user-role">Admin</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="main-header">
                <div class="header-left">
                    <button class="sidebar-toggle" id="sidebarToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 th:text="${pageTitle}">Dashboard</h1>
                </div>
                <div class="header-right">
                    <button class="btn btn-primary">
                        <i class="fas fa-plus"></i>
                        New Project
                    </button>
                </div>
            </header>
            
            <div class="content-area" th:fragment="content">
                <!-- Content will be inserted here -->
            </div>
        </main>
    </div>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
